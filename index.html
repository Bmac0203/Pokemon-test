<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Adventure</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
#game { max-width: 700px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; }
button { margin: 5px; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background-color: #4CAF50; color: white; }
button:hover { background-color: #45a049; }
#log { white-space: pre-line; border-top: 1px solid #ccc; margin-top: 10px; padding-top: 10px; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>
<div id="game">
  <h1>Pokémon Adventure</h1>
  <div id="status"></div>
  <div id="options"></div>
  <div id="log"></div>
</div>

<script>
// --- Game Variables ---
let playerName = 'Trainer';
let starter = null;
let playerHP = 50;
let playerXP = 0;
let playerLevel = 1;
let items = { 'Potion 💊': 3, 'Catch Cube 🟦': 5 };
let town = 'Starting Town';
let currentMonster = null;
let capturedPokemons = [];

// --- Pokémon List with Evolutions ---
const pokemonList = [
  { name:'Bulbasaur', type:'Grass/Poison', HP:45, attack:49, evolution:'Ivysaur', evolutionLevel:16 },
  { name:'Ivysaur', type:'Grass/Poison', HP:60, attack:62, evolution:'Venusaur', evolutionLevel:32 },
  { name:'Venusaur', type:'Grass/Poison', HP:80, attack:82, evolution:null, evolutionLevel:null },
  { name:'Charmander', type:'Fire', HP:39, attack:52, evolution:'Charmeleon', evolutionLevel:16 },
  { name:'Charmeleon', type:'Fire', HP:58, attack:64, evolution:'Charizard', evolutionLevel:36 },
  { name:'Charizard', type:'Fire/Flying', HP:78, attack:84, evolution:null, evolutionLevel:null },
  { name:'Squirtle', type:'Water', HP:44, attack:48, evolution:'Wartortle', evolutionLevel:16 },
  { name:'Wartortle', type:'Water', HP:59, attack:63, evolution:'Blastoise', evolutionLevel:36 },
  { name:'Blastoise', type:'Water', HP:79, attack:83, evolution:null, evolutionLevel:null },
  { name:'Pikachu', type:'Electric', HP:35, attack:55, evolution:'Raichu', evolutionLevel:null }, // evolves with Thunder Stone
  { name:'Raichu', type:'Electric', HP:60, attack:90, evolution:null, evolutionLevel:null },
  { name:'Sandshrew', type:'Ground', HP:50, attack:75, evolution:'Sandslash', evolutionLevel:22 },
  { name:'Sandslash', type:'Ground', HP:75, attack:100, evolution:null, evolutionLevel:null },
  { name:'Nidoran♀', type:'Poison', HP:55, attack:47, evolution:'Nidorina', evolutionLevel:16 },
  { name:'Nidorina', type:'Poison', HP:70, attack:62, evolution:'Nidoqueen', evolutionLevel:null }, // evolves with Moon Stone
  { name:'Nidoqueen', type:'Poison/Ground', HP:90, attack:92, evolution:null, evolutionLevel:null },
  { name:'Nidoran♂', type:'Poison', HP:46, attack:57, evolution:'Nidorino', evolutionLevel:16 },
  { name:'Nidorino', type:'Poison', HP:61, attack:72, evolution:'Nidoking', evolutionLevel:null }, // evolves with Moon Stone
  { name:'Nidoking', type:'Poison/Ground', HP:81, attack:102, evolution:null, evolutionLevel:null },
  { name:'Clefairy', type:'Fairy', HP:70, attack:45, evolution:'Clefable', evolutionLevel:null }, // Moon Stone
  { name:'Clefable', type:'Fairy', HP:95, attack:70, evolution:null, evolutionLevel:null },
  { name:'Vulpix', type:'Fire', HP:38, attack:41, evolution:'Ninetales', evolutionLevel:null }, // Fire Stone
  { name:'Ninetales', type:'Fire', HP:73, attack:76, evolution:null, evolutionLevel:null },
  { name:'Jigglypuff', type:'Normal/Fairy', HP:115, attack:45, evolution:'Wigglytuff', evolutionLevel:null }, // Moon Stone
  { name:'Wigglytuff', type:'Normal/Fairy', HP:140, attack:70, evolution:null, evolutionLevel:null },
  { name:'Zubat', type:'Poison/Flying', HP:40, attack:45, evolution:'Golbat', evolutionLevel:22 },
  { name:'Golbat', type:'Poison/Flying', HP:75, attack:80, evolution:null, evolutionLevel:null },
  { name:'Oddish', type:'Grass/Poison', HP:45, attack:50, evolution:'Gloom', evolutionLevel:21 },
  { name:'Gloom', type:'Grass/Poison', HP:60, attack:65, evolution:'Vileplume', evolutionLevel:null }, // Leaf Stone
  { name:'Vileplume', type:'Grass/Poison', HP:75, attack:90, evolution:null, evolutionLevel:null },
  { name:'Paras', type:'Bug/Grass', HP:35, attack:70, evolution:'Parasect', evolutionLevel:24 },
  { name:'Parasect', type:'Bug/Grass', HP:60, attack:95, evolution:null, evolutionLevel:null },
  { name:'Venonat', type:'Bug/Poison', HP:60, attack:55, evolution:'Venomoth', evolutionLevel:31 },
  { name:'Venomoth', type:'Bug/Poison', HP:70, attack:65, evolution:null, evolutionLevel:null },
  { name:'Diglett', type:'Ground', HP:10, attack:55, evolution:'Dugtrio', evolutionLevel:26 },
  { name:'Dugtrio', type:'Ground', HP:35, attack:100, evolution:null, evolutionLevel:null },
  { name:'Meowth', type:'Normal', HP:40, attack:45, evolution:'Persian', evolutionLevel:28 },
  { name:'Persian', type:'Normal', HP:65, attack:70, evolution:null, evolutionLevel:null },
  { name:'Psyduck', type:'Water', HP:50, attack:52, evolution:'Golduck', evolutionLevel:33 },
  { name:'Golduck', type:'Water', HP:80, attack:82, evolution:null, evolutionLevel:null },
  { name:'Machop', type:'Fighting', HP:70, attack:80, evolution:'Machoke', evolutionLevel:28 },
  { name:'Machoke', type:'Fighting', HP:80, attack:100, evolution:'Machamp', evolutionLevel:null }, // trade
  { name:'Machamp', type:'Fighting', HP:90, attack:130, evolution:null, evolutionLevel:null },
  { name:'Bellsprout', type:'Grass/Poison', HP:50, attack:75, evolution:'Weepinbell', evolutionLevel:21 },
  { name:'Weepinbell', type:'Grass/Poison', HP:65, attack:90, evolution:'Victreebel', evolutionLevel:null }, // Leaf Stone
  { name:'Victreebel', type:'Grass/Poison', HP:80, attack:105, evolution:null, evolutionLevel:null },
  { name:'Tentacool', type:'Water/Poison', HP:40, attack:40, evolution:'Tentacruel', evolutionLevel:30 },
  { name:'Tentacruel', type:'Water/Poison', HP:80, attack:70, evolution:null, evolutionLevel:null }
];

// --- Gyms (9 Gyms) ---
const gyms = [
  {name:'Rocky Gym 🪨', monster:{name:'Stone Turtle 🐢', HP:60, attack:15}, rewardXP:50},
  {name:'Flame Gym 🔥', monster:{name:'Blaze Lizard 🔥', HP:65, attack:18}, rewardXP:60},
  {name:'Water Gym 💧', monster:{name:'Splash Turtle 💧', HP:70, attack:20}, rewardXP:65},
  {name:'Forest Gym 🌿', monster:{name:'Leaf Beast 🌿', HP:75, attack:22}, rewardXP:70},
  {name:'Electric Gym ⚡', monster:{name:'Shock Mouse ⚡', HP:80, attack:25}, rewardXP:75},
  {name:'Ice Gym ❄️', monster:{name:'Frost Wolf ❄️', HP:85, attack:28}, rewardXP:80},
  {name:'Dark Gym 🌑', monster:{name:'Shadow Crow 🌑', HP:90, attack:30}, rewardXP:85},
  {name:'Dragon Gym 🐉', monster:{name:'Fire Dragon 🐉', HP:95, attack:35}, rewardXP:90},
  {name:'Master Gym 🏆', monster:{name:'Legend Beast 🏆', HP:120, attack:45}, rewardXP:100}
];

// --- DOM Elements ---
const statusDiv = document.getElementById('status');
const optionsDiv = document.getElementById('options');
const logDiv = document.getElementById('log');

function log(msg){ logDiv.textContent += msg+'\n'; logDiv.scrollTop = logDiv.scrollHeight; }
function updateStatus(){ statusDiv.innerHTML=`<strong>${playerName}</strong><br>HP: ${playerHP} | Level: ${playerLevel} | XP: ${playerXP}<br>Potion: ${items['Potion 💊']} | Catch Cube: ${items['Catch Cube 🟦']}`; }

// --- Game Functions ---
function chooseStarter(){
  optionsDiv.innerHTML='';
  log('Choose your starter Pokémon:');
  ['Bulbasaur 🌱','Charmander 🔥','Squirtle 💧'].forEach((s,i)=>{
    const btn = document.createElement('button');
    btn.textContent=s;
    btn.onclick=()=>{ starter=pokemonList[i]; playerHP=starter.HP; log(`You chose ${starter.name}!`); updateStatus(); mainMenu(); };
    optionsDiv.appendChild(btn);
  });
}

function gainXP(amount){
  playerXP += amount;
  log(`You gained ${amount} XP! Total XP: ${playerXP}`);
  if(starter.evolution && ((starter.evolutionLevel && playerLevel >= starter.evolutionLevel) || !starter.evolutionLevel)){
    evolvePokemon();
  }
  updateStatus();
}

function evolvePokemon(){
  const evoName = starter.evolution;
  const evoData = pokemonList.find(p => p.name === evoName);
  if(evoData){
    log(`${starter.name} evolved into ${evoData.name}! 🎉`);
    starter.name = evoData.name;
    starter.type = evoData.type;
    starter.HP = evoData.HP;
    starter.attack = evoData.attack;
    starter.evolution = evoData.evolution;
    starter.evolutionLevel = evoData.evolutionLevel;
    playerHP = starter.HP;
    updateStatus();
  }
}

function getRandomPokemon(){ return pokemonList[Math.floor(Math.random()*pokemonList.length)]; }

function battle(monster, rewardXP=10){
  currentMonster={...monster};
  log(`A wild ${currentMonster.name} appeared! HP: ${currentMonster.HP}`);
  updateStatus();
  showBattleOptions(rewardXP);
}

function showBattleOptions(rewardXP){
  optionsDiv.innerHTML='';
  ['Fight ⚔️','Run 🏃','Bag 🎒'].forEach(action=>{
    const btn=document.createElement('button');
    btn.textContent=action;
    btn.onclick=()=>{ if(action==='Fight ⚔️') fight(rewardXP); else if(action==='Run 🏃') run(); else if(action==='Bag 🎒') bag(rewardXP); };
    optionsDiv.appendChild(btn);
  });
}

function fight(rewardXP){
  const damage=starter.attack+Math.floor(Math.random()*5);
  currentMonster.HP-=damage;
  log(`You attacked! ${currentMonster.name} HP: ${currentMonster.HP}`);
  if(currentMonster.HP<=0){ log(`You defeated ${currentMonster.name}!`); gainXP(rewardXP); mainMenu(); return; }
  const monsterDamage=currentMonster.attack+Math.floor(Math.random()*5);
  playerHP-=monsterDamage;
  log(`${currentMonster.name} attacked back! Your HP: ${playerHP}`);
  updateStatus();
  if(playerHP<=0){ log('You fainted! Game Over 💀'); optionsDiv.innerHTML=''; return; }
}

function run(){ if(Math.random()<0.5){ log('You ran away safely!'); mainMenu(); } else { log('Failed to run! Monster attacks!'); playerHP-=currentMonster.attack+Math.floor(Math.random()*5); updateStatus(); if(playerHP<=0){ log('You fainted! Game Over 💀'); optionsDiv.innerHTML=''; return; } } }

function bag(rewardXP){
  optionsDiv.innerHTML='';
  ['Potion 💊','Catch Cube 🟦'].forEach(item=>{
    const btn=document.createElement('button');
    btn.textContent=`${item} (${items[item]})`;
    btn.onclick=()=>{
      if(item==='Potion 💊' && items[item]>0){playerHP+=20; items[item]--; log(`You used a Potion! HP: ${playerHP}`); updateStatus(); showBattleOptions(rewardXP); }
      else if(item==='Catch Cube 🟦' && items[item]>0){
        items[item]--; 
        if(Math.random()<0.5){log(`You caught ${currentMonster.name}! 🟦`); capturedPokemons.push(currentMonster); gainXP(Math.floor(rewardXP/2)); mainMenu();}
        else {log('The monster escaped!'); showBattleOptions(rewardXP);}
        updateStatus(); 
      }
      else{log('Invalid or no items left!'); showBattleOptions(rewardXP);}
    };
    optionsDiv.appendChild(btn);
  });
}

function mainMenu(){
  optionsDiv.innerHTML='';
  log(`\nWelcome to ${town}! Choose your action:`);
  ['Heal 🏥','Gym Challenge 🏆','Go Wild 🌲','Save 💾','Load 📂'].forEach(action=>{
    const btn=document.createElement('button');
    btn.textContent=action;
    btn.onclick=()=>{
      if(action==='Heal 🏥'){ playerHP=starter.HP; log('Your Pokémon have been healed!'); updateStatus(); }
      else if(action==='Gym Challenge 🏆'){ const gym=gyms[Math.floor(Math.random()*gyms.length)]; log(`You challenge the ${gym.name}!`); battle(gym.monster,gym.rewardXP); }
      else if(action==='Go Wild 🌲'){ battle(getRandomPokemon(),10); }
      else if(action==='Save 💾'){ log('Game saved! (simulated)'); }
      else if(action==='Load 📂'){ log('Game loaded! (simulated)'); }
    };
    optionsDiv.appendChild(btn);
  });
  updateStatus();
}

// --- Start Game ---
chooseStarter();
</script>
</body>
</html>
