<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéLite</title>
  <style>
    body {
      background: #0d0f1a;
      color: #d0d6f9;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .game {
      background: #12131f;
      border: 1px solid #1f1f30;
      border-radius: 16px;
      box-shadow: 0 0 20px #1a1b2d;
      width: 420px;
      max-width: 90%;
      padding: 20px;
      text-align: center;
    }
    .title {
      font-size: 1.4em;
      color: #fff;
      margin-bottom: 10px;
    }
    .log {
      background: #0e0f1b;
      border-radius: 10px;
      padding: 10px;
      height: 180px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    button {
      background: #1f1f30;
      color: #d0d6f9;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2a2a45; }
    .stats {
      margin-bottom: 10px;
      font-size: 0.9em;
      color: #aab0d0;
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="title">PokéLite</div>
    <div class="stats" id="stats"></div>
    <div class="log" id="log"></div>
    <div class="btns" id="buttons"></div>
  </div>

  <script>
    const $log = document.getElementById("log");
    const $buttons = document.getElementById("buttons");
    const $stats = document.getElementById("stats");

    function log(t) {
      $log.innerHTML += `<div>${t}</div>`;
      $log.scrollTop = $log.scrollHeight;
    }

    const monsters = [
      { name: "Flamion", type: "Fire", evolve: "Blazion" },
      { name: "Aquava", type: "Water", evolve: "Tsunava" },
      { name: "Leaflit", type: "Grass", evolve: "Florath" },
      { name: "Sparka", type: "Electric", evolve: "Voltair" },
      { name: "Stonox", type: "Rock", evolve: "Granidon" },
      { name: "Venomix", type: "Poison", evolve: "Toxira" },
      { name: "Frosto", type: "Ice", evolve: "Cryon" },
      { name: "Shadowl", type: "Dark", evolve: "Umbrax" },
      { name: "Pyroca", type: "Fire", evolve: "Volcaon" },
      { name: "Seapho", type: "Water", evolve: "Hydros" },
      { name: "Terraxa", type: "Ground", evolve: "Geozaur" },
      { name: "Aerial", type: "Flying", evolve: "Skyris" },
      { name: "Psychon", type: "Psychic", evolve: "Mindor" },
      { name: "Boulder", type: "Rock", evolve: "Graniton" },
      { name: "Inferno", type: "Fire", evolve: null },
      { name: "Zephyra", type: "Flying", evolve: null },
      { name: "Tundra", type: "Ice", evolve: null },
      { name: "Voltusk", type: "Electric", evolve: null },
    ];

    let player = {
      name: "",
      monster: null,
      level: 1,
      xp: 0,
      hp: 50,
      pokeballs: 5,
      potions: 2,
      captured: [],
      gymWins: 0
    };

    let enemy = null;
    let state = "start";

    function saveGame() {
      localStorage.setItem("pokelite_save", JSON.stringify(player));
      log("💾 Game saved!");
    }

    function loadGame() {
      const save = localStorage.getItem("pokelite_save");
      if (save) {
        player = JSON.parse(save);
        log("📂 Game loaded!");
        updateStats();
        mainMenu();
      } else log("No save found.");
    }

    function updateStats() {
      $stats.innerHTML = `
        <b>${player.name}</b> — Lv ${player.level} — ${player.hp} HP<br>
        Pokéballs: ${player.pokeballs}, Potions: ${player.potions}, Gyms: ${player.gymWins}
      `;
    }

    function clearButtons() { $buttons.innerHTML = ""; }

    function setButtons(btns) {
      clearButtons();
      for (const [label, fn] of Object.entries(btns)) {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = fn;
        $buttons.appendChild(b);
      }
    }

    function startGame() {
      state = "starter";
      log("Welcome to PokéLite! Choose your starter:");
      clearButtons();
      monsters.slice(0, 3).forEach(m => {
        const b = document.createElement("button");
        b.textContent = m.name;
        b.onclick = () => {
          player.monster = JSON.parse(JSON.stringify(m));
          player.captured.push(player.monster.name);
          log(`You chose ${m.name}!`);
          updateStats();
          mainMenu();
        };
        $buttons.appendChild(b);
      });
    }

    function mainMenu() {
      state = "menu";
      setButtons({
        "Explore 🌿": explore,
        "Gym ⚔️": gymBattle,
        "Heal 💧": heal,
        "Save 💾": saveGame,
        "Load 📂": loadGame
      });
    }

    function explore() {
      state = "explore";
      log("You venture into the wild...");
      if (Math.random() < 0.7) {
        const wild = monsters[Math.floor(Math.random() * monsters.length)];
        enemy = { ...wild, level: Math.floor(Math.random() * 5) + 1, hp: 30 + Math.random() * 20 };
        log(`🌿 A wild ${enemy.name} appeared!`);
        battleMenu();
      } else {
        log("You found a Potion!");
        player.potions++;
        updateStats();
        mainMenu();
      }
    }

    function battleMenu() {
      setButtons({
        "Attack ⚔️": attack,
        "Item 🎒": useItem,
        "Catch 🎯": catchMonster,
        "Run 🏃": mainMenu
      });
    }

    function attack() {
      const dmg = Math.floor(Math.random() * 10) + 5 + player.level;
      enemy.hp -= dmg;
      log(`You dealt ${dmg} damage! ${enemy.name} has ${Math.max(enemy.hp, 0)} HP left.`);
      if (enemy.hp <= 0) {
        const xpGain = 10 + Math.floor(Math.random() * 10);
        log(`You defeated ${enemy.name}! +${xpGain} XP`);
        player.xp += xpGain;
        if (player.xp >= player.level * 20) levelUp();
        updateStats();
        mainMenu();
      } else {
        const enemyDmg = Math.floor(Math.random() * 10) + enemy.level;
        player.hp -= enemyDmg;
        log(`${enemy.name} hit back for ${enemyDmg} damage!`);
        if (player.hp <= 0) {
          log("💀 You fainted! Returning to town...");
          player.hp = 50;
          mainMenu();
        } else battleMenu();
      }
    }

    function useItem() {
      setButtons({
        "Potion (+20 HP)": () => {
          if (player.potions > 0) {
            player.potions--;
            player.hp = Math.min(50 + player.level * 5, player.hp + 20);
            log("You used a Potion!");
            updateStats();
            battleMenu();
          } else {
            log("No potions left!");
            battleMenu();
          }
        },
        "Back": battleMenu
      });
    }

    function catchMonster() {
      if (player.pokeballs <= 0) {
        log("No Pokéballs left!");
        battleMenu();
        return;
      }
      player.pokeballs--;
      if (Math.random() < 0.4 + (0.1 * (player.level / 5))) {
        log(`🎯 You caught ${enemy.name}!`);
        player.captured.push(enemy.name);
        updateStats();
        mainMenu();
      } else {
        log(`${enemy.name} broke free!`);
        attack();
      }
    }

    function levelUp() {
      player.level++;
      player.xp = 0;
      player.hp = 50 + player.level * 5;
      log(`⭐ You leveled up! Now level ${player.level}!`);
      if (player.monster.evolve && player.level === 5) {
        log(`✨ ${player.monster.name} evolved into ${player.monster.evolve}!`);
        player.monster.name = player.monster.evolve;
      }
    }

    function heal() {
      player.hp = 50 + player.level * 5;
      log("✨ Fully healed!");
      updateStats();
      mainMenu();
    }

    function gymBattle() {
      log("🏟️ You challenge a Gym Leader!");
      enemy = { name: "Gym Leader's Titan", level: player.level + 3, hp: 60 + player.level * 5 };
      battleMenu();
    }

    log("Starting PokéLite...");
    const save = localStorage.getItem("pokelite_save");
    if (save) {
      player = JSON.parse(save);
      log("📂 Save found. Loading...");
      updateStats();
      mainMenu();
    } else {
      startGame();
    }
  </script>
</body>
</html>
